<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="robots" content="noindex,nofollow">
<title>Takımyıldızımız</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@500;700&display=swap">
<style>
/* Gece gökyüzü: mürekkep laciverti zemin, altın yıldız çizgileri; yazı neredeyse yok. */
:root{
  color-scheme:dark;
  --sky:#05060f; --ink:#0d1030; --gold:#f0d29a; --star:#fff6e6; --mute:rgba(255,246,230,.55); --wrong:#ff8fa3;
  --serif:'Cormorant Garamond','Times New Roman',serif; --sans:'Manrope',-apple-system,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:var(--sky);color:var(--star);font:500 15px/1.4 var(--sans);overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Şifre */
#lock{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));transition:opacity 1.1s ease,filter 1.1s ease}
#lock.gone{opacity:0;filter:blur(8px);pointer-events:none}
.dots{display:flex;gap:18px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(240,210,154,.6);transition:background .2s,border-color .2s,transform .2s,box-shadow .3s}
.dots i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px rgba(240,210,154,.8);transform:scale(1.1)}
.dots.busy i.on{animation:blink .8s ease-in-out infinite}
.dots.bad{animation:shake .5s}.dots.bad i{border-color:var(--wrong)}.dots.bad i.on{background:var(--wrong);box-shadow:0 0 14px var(--wrong)}
.dots.ok i{background:var(--gold);box-shadow:0 0 22px var(--gold)}
@keyframes blink{50%{opacity:.35}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#msg{min-height:2.6em;max-width:320px;text-align:center;font:italic 500 25px/1.2 var(--serif);color:var(--gold);text-wrap:balance;opacity:0;transition:opacity .35s}
#msg.show{opacity:1}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:16px 22px}
.pad button{appearance:none;width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,246,230,.16);background:rgba(255,246,230,.05);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 32px/1 var(--serif);cursor:pointer;transition:background .15s,transform .15s}
.pad button:active{background:rgba(240,210,154,.25);transform:scale(.94)}
.pad .ghost{visibility:hidden}
.pad .del{font:700 13px var(--sans);letter-spacing:.08em;border-color:transparent;background:none;color:var(--mute)}

/* Fotoğraf */
#view{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(5,6,15,.5),rgba(5,6,15,.94) 75%);opacity:0;transition:opacity .55s ease;cursor:pointer}
#view.on{opacity:1}
.frame{--ar:.75;width:min(92vw,calc(80vh * var(--ar)));aspect-ratio:var(--ar);max-width:100%;transition:transform .85s cubic-bezier(.2,.85,.2,1),opacity .7s ease;will-change:transform;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent),linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent),linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-composite:intersect}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
#view.on .frame img{animation:kb 10s ease-out both}
@keyframes kb{from{transform:scale(1.07)}to{transform:none}}
#idx{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);font:italic 500 18px var(--serif);color:var(--mute);letter-spacing:.06em;font-variant-numeric:lining-nums tabular-nums;pointer-events:none}

/* Yönlendirme ve final */
#hint{position:fixed;left:0;right:0;bottom:max(34px,env(safe-area-inset-bottom));text-align:center;font:italic 500 19px var(--serif);color:var(--mute);opacity:0;transition:opacity 1s;pointer-events:none;z-index:2}
#hint.show{opacity:1}
#end{position:fixed;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));z-index:2;text-align:center;display:grid;gap:6px;opacity:0;transform:translateY(14px);transition:opacity 2s ease,transform 2s ease;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
#end.show{opacity:1;transform:none}
#end h1{margin:0;font:italic 500 clamp(44px,13vw,64px)/1 var(--serif);color:var(--gold);text-shadow:0 0 30px rgba(240,210,154,.35)}
#end p{margin:0;font:700 12px var(--sans);letter-spacing:.42em;color:var(--star);font-variant-numeric:lining-nums}
#end button{pointer-events:auto;justify-self:center;appearance:none;background:none;border:0;color:var(--mute);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:8px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<section id="lock" aria-label="Şifre">
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p id="msg" role="status"></p>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="ghost" tabindex="-1" aria-hidden="true"></button><button data-k="0">0</button><button class="del" data-k="del" aria-label="Sil">SİL</button>
  </div>
</section>
<section id="view" hidden><div class="frame" id="frame"><img id="ph" alt=""></div><span id="idx"></span></section>
<p id="hint">Parlayan yıldıza dokun</p>
<div id="end"><h1>Can &amp; Ayça</h1><p>10 · 09 · 26</p><button id="again">Baştan izle</button></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const MSG=['Yapabiliyorum aaağğ, ne?','Aşkım, ikimizin bir günü','Hadi artık, ne zaman manita olduk?'];
const LS='takimyildizi-v1';
const get=()=>{try{return +localStorage.getItem(LS)||0}catch(e){return 0}}, put=v=>{try{localStorage.setItem(LS,v)}catch(e){}};
const data=fetch('s.bin').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()});

/* ---------- Takımyıldızı: 0 = açılış yıldızı, C (8), A (10). Tasarım alanı 100 x 120 ---------- */
const P=[[48,63,null]];
for(let k=0;k<8;k++){const a=(300-k*240/7)*Math.PI/180;P.push([24+18*Math.cos(a),63+25*Math.sin(a),k?P.length-1:null])}
const leg=(t,s)=>[76+s*16*(1-t),38+52*(1-t)];
const L=[0,.3,.65,1].map(t=>leg(t,-1)), R=[.65,.3,0].map(t=>leg(t,1));
const a0=P.length;[...L,...R].forEach((p,i)=>P.push([p[0],p[1],i?P.length-1:null]));
const bar=[[67.4,66],[76,66],[84.6,66]];bar.forEach((p,i)=>P.push([p[0],p[1],i?P.length-1:null]));
const N=P.length;

/* ---------- Gökyüzü ---------- */
const cv=$('#sky'),cx=cv.getContext('2d');let W,H,D,sc,ox,oy,bg;
const dust=[...Array(150)].map(()=>({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.3,a:.25+Math.random()*.6,s:.6+Math.random()*2,p:Math.random()*7}));
const glow=document.createElement('canvas');glow.width=glow.height=64;{const g=glow.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,236,200,1)');r.addColorStop(.25,'rgba(240,210,154,.45)');r.addColorStop(1,'rgba(240,210,154,0)');g.fillStyle=r;g.fillRect(0,0,64,64)}
function size(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  sc=Math.min(W*.9/100,H*.66/120);ox=W/2-50*sc;oy=H*.46-64*sc;
  bg=document.createElement('canvas');bg.width=W*D;bg.height=H*D;const g=bg.getContext('2d');g.scale(D,D);
  let r=g.createLinearGradient(0,0,0,H);r.addColorStop(0,'#05060f');r.addColorStop(.55,'#0b0e2a');r.addColorStop(1,'#140c26');g.fillStyle=r;g.fillRect(0,0,W,H);
  r=g.createRadialGradient(W*.7,H*.25,0,W*.7,H*.25,W*.9);r.addColorStop(0,'rgba(110,100,200,.16)');r.addColorStop(1,'rgba(110,100,200,0)');g.fillStyle=r;g.fillRect(0,0,W,H);
  r=g.createRadialGradient(W*.15,H*.85,0,W*.15,H*.85,W*.8);r.addColorStop(0,'rgba(200,110,140,.10)');r.addColorStop(1,'rgba(200,110,140,0)');g.fillStyle=r;g.fillRect(0,0,W,H);
}
size();addEventListener('resize',size);
const pos=i=>[ox+P[i][0]*sc,oy+P[i][1]*sc];
let phase='lock',opened=0,lines=[],sparks=[],shoot=null,cam=1,camT=null,t0=performance.now();
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function burst(x,y,n=40,col='240,210,154'){if(still)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=.6+Math.random()*3.4;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:col})}}
function frame(now){
  requestAnimationFrame(frame);if(document.hidden)return;
  const t=(now-t0)/1000;
  cx.drawImage(bg,0,0,W,H);
  const fin=phase==='final';
  // toz yıldızlar
  for(const s of dust){const a=s.a*(.55+.45*Math.sin(t*s.s+s.p))*(fin?.45:1)*(phase==='lock'?.7:1);cx.globalAlpha=a;cx.fillStyle='#fff6e6';cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,6.283);cx.fill()}
  // kayan yıldız
  if(!still&&!shoot&&Math.random()<.004)shoot={x:Math.random()*W*.8+W*.2,y:Math.random()*H*.4,l:1};
  if(shoot){cx.globalAlpha=shoot.l*.8;const g=cx.createLinearGradient(shoot.x,shoot.y,shoot.x+90,shoot.y-40);g.addColorStop(0,'rgba(255,246,230,1)');g.addColorStop(1,'rgba(255,246,230,0)');cx.strokeStyle=g;cx.lineWidth=1.4;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x+90,shoot.y-40);cx.stroke();shoot.x-=7;shoot.y+=3.1;shoot.l-=.018;if(shoot.l<=0)shoot=null}
  // kamera (final geri çekilme)
  if(camT!==null){const k=Math.min(1,(now-camT)/3200);cam=1-.14*(1-Math.pow(1-k,3))}
  cx.save();const cxm=W/2,cym=oy+64*sc;cx.translate(cxm,cym);cx.scale(cam,cam);cx.translate(-cxm,-cym-(1-cam)*H*.35);
  // çizgiler
  cx.lineCap='round';
  for(const ln of lines){ln.p=Math.min(1,ln.p+.022);const [x1,y1]=pos(ln.a),[x2,y2]=pos(ln.b),x=x1+(x2-x1)*ln.p,y=y1+(y2-y1)*ln.p;
    const pulse=fin?.75+.25*Math.sin(t*1.6):1;
    cx.globalAlpha=.22*pulse;cx.strokeStyle='#f0d29a';cx.lineWidth=fin?7:5;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x,y);cx.stroke();
    cx.globalAlpha=.9*pulse;cx.lineWidth=fin?1.8:1.3;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x,y);cx.stroke()}
  // takımyıldızı yıldızları
  for(let i=0;i<N;i++){const [x,y]=pos(i);
    if(phase==='lock'){cx.globalAlpha=.5;cx.fillStyle='#fff6e6';cx.beginPath();cx.arc(x,y,1.3,0,6.283);cx.fill();continue}
    if(i<opened){const g=fin?26+4*Math.sin(t*2+i):20;cx.globalAlpha=.9;cx.drawImage(glow,x-g/2,y-g/2,g,g);cx.globalAlpha=1;cx.fillStyle='#fff6e6';cx.beginPath();cx.arc(x,y,2.6,0,6.283);cx.fill()}
    else if(i===opened){const p=(Math.sin(t*3)+1)/2,g=34+16*p;cx.globalAlpha=.65+.35*p;cx.drawImage(glow,x-g/2,y-g/2,g,g);cx.globalAlpha=.5*(1-p);cx.strokeStyle='#f0d29a';cx.lineWidth=1;cx.beginPath();cx.arc(x,y,10+14*p,0,6.283);cx.stroke();cx.globalAlpha=1;cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,3.2,0,6.283);cx.fill()}
    else{cx.globalAlpha=.4+.3*Math.sin(t*1.3+i*2);cx.fillStyle='#fff6e6';cx.beginPath();cx.arc(x,y,1.3,0,6.283);cx.fill()}
  }
  cx.restore();
  // kıvılcımlar
  sparks=sparks.filter(s=>s.l>0);for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vx*=.97;s.vy*=.97;s.l-=.014;cx.globalAlpha=Math.max(0,s.l);cx.fillStyle=`rgb(${s.c})`;cx.fillRect(s.x-1,s.y-1,2,2)}
  cx.globalAlpha=1;
}
requestAnimationFrame(frame);
// kameraya göre ekrandaki gerçek konum
const screenPos=i=>{const [x,y]=pos(i),cxm=W/2,cym=oy+64*sc;return[cxm+(x-cxm)*cam,cym+(y-cym-(1-cam)*H*.35)*cam]};

/* ---------- Şifre ---------- */
let pin='',wrong=0,busy=false,photos=[];
const dots=[...document.querySelectorAll('#dots i')];
const showDots=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<pin.length));
const say=(t,col)=>{const m=$('#msg');m.classList.remove('show');setTimeout(()=>{m.textContent=t;m.style.color=col||'';m.classList.toggle('show',!!t)},t?180:0)};
async function unlock(code){
  const buf=new Uint8Array(await data),enc=new TextEncoder().encode(code);
  const base=await crypto.subtle.importKey('raw',enc,'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:buf.slice(0,16),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt;try{pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(16,28)},key,buf.slice(28)))}catch(e){return false}
  const hl=new DataView(pt.buffer).getUint32(0),head=JSON.parse(new TextDecoder().decode(pt.slice(4,4+hl)));let o=4+hl;
  photos=head.len.map(n=>{const u=URL.createObjectURL(new Blob([pt.slice(o,o+n)],{type:'image/jpeg'}));o+=n;const im=new Image();im.src=u;return{u,im}});
  return true;
}
async function press(k){
  if(busy||phase!=='lock')return;
  if(k==='del'){pin=pin.slice(0,-1);showDots();return}
  if(pin.length>=6)return;
  pin+=k;showDots();if(navigator.vibrate)navigator.vibrate(8);
  if(pin.length<6)return;
  busy=true;$('#dots').classList.add('busy');
  let ok=false;try{ok=await unlock(pin)}catch(e){ok=false}
  $('#dots').classList.remove('busy');
  if(!ok){
    say(MSG[Math.min(wrong,2)]);wrong++;$('#dots').classList.add('bad');if(navigator.vibrate)navigator.vibrate(140);
    setTimeout(()=>{$('#dots').classList.remove('bad');pin='';showDots();busy=false},650);return;
  }
  $('#dots').classList.add('ok');
  if(wrong===0){say('Helal len, tekte bildin');const r=$('#dots').getBoundingClientRect();burst(r.left+r.width/2,r.top+6,90)}
  else say('');
  setTimeout(start,wrong===0?2100:700);
}
$('#pad').onclick=e=>{const b=e.target.closest('button[data-k]');if(b)press(b.dataset.k)};
addEventListener('keydown',e=>{if(phase!=='lock')return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del')});
data.catch(()=>say('Sayfa tam yüklenmedi, yenile'));

/* ---------- Gezinti ---------- */
function rebuildLines(){lines=[];for(let i=1;i<opened;i++)if(P[i][2]!==null)lines.push({a:P[i][2],b:i,p:1})}
function start(){
  $('#lock').classList.add('gone');setTimeout(()=>$('#lock').hidden=true,1200);
  opened=Math.min(get(),N);rebuildLines();phase='sky';
  if(opened>=N){finale(false);return}
  if(opened===0)setTimeout(()=>$('#hint').classList.add('show'),1400);
}
let viewing=-1;
function open(i){
  viewing=i;$('#hint').classList.remove('show');
  const v=$('#view'),f=$('#frame'),ph=photos[i],img=$('#ph');
  const ar=ph.im.naturalWidth&&ph.im.naturalHeight?ph.im.naturalWidth/ph.im.naturalHeight:.75;
  f.style.setProperty('--ar',ar.toFixed(3));img.src=ph.u;
  $('#idx').textContent=String(i+1).padStart(2,'0')+' / '+N;
  v.hidden=false;
  const [sx,sy]=screenPos(i);
  f.style.transition='none';f.style.opacity='0';f.style.transform=`translate(${sx-W/2}px,${sy-H/2}px) scale(.04)`;
  void f.offsetWidth;
  burst(sx,sy,36);if(navigator.vibrate)navigator.vibrate(15);
  requestAnimationFrame(()=>{f.style.transition='';v.classList.add('on');f.style.opacity='1';f.style.transform='none'});
}
function close(){
  if(viewing<0)return;const i=viewing;viewing=-1;
  const v=$('#view'),f=$('#frame'),[sx,sy]=screenPos(i);
  v.classList.remove('on');f.style.opacity='0';f.style.transform=`translate(${sx-W/2}px,${sy-H/2}px) scale(.04)`;
  setTimeout(()=>{v.hidden=true;$('#ph').removeAttribute('src')},700);
  if(phase==='sky'&&i===opened){
    opened++;put(opened);
    setTimeout(()=>{burst(sx,sy,24);if(P[i][2]!==null)lines.push({a:P[i][2],b:i,p:0});if(opened>=N)setTimeout(()=>finale(true),1300)},650);
  }
}
$('#view').onclick=close;
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
cv.addEventListener('pointerup',e=>{
  if(viewing>=0||(phase!=='sky'&&phase!=='final'))return;
  const hit=i=>{const [x,y]=screenPos(i);return Math.hypot(e.clientX-x,e.clientY-y)};
  if(phase==='sky'){if(hit(opened)<46)open(opened);return}
  let best=-1,bd=34;for(let i=0;i<N;i++){const d=hit(i);if(d<bd){bd=d;best=i}}if(best>=0)open(best);
});
function finale(anim){
  phase='final';opened=N;rebuildLines();
  if(anim){camT=performance.now();const [x,y]=pos(a0+3);burst(W/2,y,140);setTimeout(()=>burst(W*.3,H*.4,90,'255,246,230'),700);if(navigator.vibrate)navigator.vibrate([40,80,40])}
  else{cam=.86}
  setTimeout(()=>$('#end').classList.add('show'),anim?2200:200);
}
$('#again').onclick=()=>{put(0);opened=0;lines=[];cam=1;camT=null;phase='sky';$('#end').classList.remove('show');setTimeout(()=>$('#hint').classList.add('show'),800)};
</script>
</body>
</html>
